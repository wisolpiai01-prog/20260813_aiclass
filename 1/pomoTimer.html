<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --primary: #f97316;
      --primary-soft: #fdba74;
      --secondary: #22c55e;
      --text: #f9fafb;
      --muted: #d1d5db;
      --danger: #ef4444;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2937, var(--bg));
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .timer-wrap {
      width: min(90vw, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .timer-ring {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(var(--primary) 0deg, var(--primary) var(--progress), rgba(255,255,255,0.08) var(--progress), rgba(255,255,255,0.08) 360deg);
      box-shadow: 0 18px 40px var(--shadow);
      transition: background 0.5s ease, transform 0.3s ease;
    }

    .timer-ring.break-mode {
      background: conic-gradient(var(--secondary) 0deg, var(--secondary) var(--progress), rgba(255,255,255,0.08) var(--progress), rgba(255,255,255,0.08) 360deg);
    }

    .timer-ring.alert {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.8);
    }

    .timer-ring::before {
      content: "";
      position: absolute;
      inset: 18px;
      background: var(--panel);
      border-radius: 50%;
      box-shadow: inset 0 0 18px rgba(255,255,255,0.05);
    }

    .timer-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .mode-label {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .time {
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .start-btn {
      background: var(--primary);
      color: white;
    }

    .pause-btn {
      background: #374151;
      color: white;
    }

    .reset-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .status {
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="timer-wrap">
    <div id="timerRing" class="timer-ring" aria-live="polite">
      <div class="timer-content">
        <div id="modeLabel" class="mode-label">Focus</div>
        <div id="time" class="time">25:00</div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="start-btn">시작</button>
      <button id="pauseBtn" class="pause-btn">일시정지</button>
      <button id="resetBtn" class="reset-btn">리셋</button>
    </div>

    <div id="status" class="status">준비됨</div>
  </div>

  <script>
    const FOCUS_TIME = 25 * 60;
    const BREAK_TIME = 5 * 60;

    let totalSeconds = FOCUS_TIME;
    let remainingSeconds = FOCUS_TIME;
    let timerId = null;
    let isRunning = false;
    let isBreak = false;

    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');
    const modeLabelEl = document.getElementById('modeLabel');
    const timerRingEl = document.getElementById('timerRing');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    function formatTime(seconds) {
      const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${minutes}:${secs}`;
    }

    function updateRing() {
      const progress = ((totalSeconds - remainingSeconds) / totalSeconds) * 360;
      timerRingEl.style.setProperty('--progress', `${progress}deg`);
    }

    function render() {
      timeEl.textContent = formatTime(remainingSeconds);
      modeLabelEl.textContent = isBreak ? 'Break' : 'Focus';
      timerRingEl.classList.toggle('break-mode', isBreak);
      updateRing();
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function playAlert() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = 880;
      gainNode.gain.value = 0.2;

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.3);

      timerRingEl.classList.add('alert');
      setTimeout(() => timerRingEl.classList.remove('alert'), 400);
    }

    function switchPhase() {
      isBreak = !isBreak;
      totalSeconds = isBreak ? BREAK_TIME : FOCUS_TIME;
      remainingSeconds = totalSeconds;
      render();
      setStatus(isBreak ? '휴식 시간입니다.' : '집중 시간입니다.');
      playAlert();
    }

    function tick() {
      if (remainingSeconds > 0) {
        remainingSeconds -= 1;
        render();
        return;
      }

      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      switchPhase();
      startTimer();
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      setStatus(isBreak ? '휴식 중...' : '집중 중...');
      timerId = setInterval(tick, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      setStatus('일시정지');
    }

    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      isBreak = false;
      totalSeconds = FOCUS_TIME;
      remainingSeconds = FOCUS_TIME;
      render();
      setStatus('준비됨');
    }

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    render();
  </script>
</body>
</html>
